plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '0.2.0'
}

android {
    namespace "org.helpapaw.helpapaw"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "org.helpapaw.helpapaw"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // Play splits the bundle by language and installs only the splits matching
    // the device's locales AT INSTALL TIME. Our translations live in Dart
    // (lib/l10n/*.arb, compiled into libapp.so), so Play's split logic cannot
    // see them — it decides purely from Android resources, of which we ship
    // none in Bulgarian. A user who installed while their phone was in English
    // therefore got no split_config.bg.apk; switching the system language to
    // Bulgarian afterwards does not reliably make Play backfill it, and with no
    // bg Android resources present Android resolves the activity config away
    // from bg, so Flutter's LocalizationPlugin reads `en` and the whole app
    // falls back to English. Reported from the field against the shipped
    // build 132, and reproduced here by removing that one 25KB split. Shipping
    // every language in the base APK removes the failure mode for about a
    // kilobyte: our only per-language Android resources are the two
    // strings.xml files, since the real translations live in the ARBs compiled
    // into libapp.so either way.
    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.10"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Background location: FusedLocationProviderClient delivering to a
    // PendingIntent, which needs no foreground service.
    implementation "com.google.android.gms:play-services-location:21.3.0"

    // Periodic re-arm safety net for location registrations dropped by OEM
    // battery managers. Not the delivery mechanism — see LocationReconcileWorker.
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // The background receiver writes userLocations/{uid} in Kotlin so a
    // location update never depends on a Dart engine being alive. Declared
    // explicitly via the BoM rather than relying on the versions the Flutter
    // plugin AARs happen to pull in transitively.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-auth"

    // Guards Geohash against silently drifting from geoflutterfire_plus.
    testImplementation "junit:junit:4.13.2"
}
