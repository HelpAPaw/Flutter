name: help_a_paw
description: Send emergency signals about animals in need
publish_to: 'none' 
version: 0.2.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  adaptive_components: ^0.0.9
  adaptive_navigation: ^0.0.9
  animations: ^2.0.8
  cloud_firestore: ^5.4.4
  cupertino_icons: ^1.0.6
  firebase_analytics: ^11.3.3
  firebase_app_check: ^0.3.1+3
  firebase_app_installations: ^0.3.1+4
  firebase_auth: ^5.3.1
  firebase_ui_auth: ^1.16.0
  firebase_ui_oauth_google: ^1.4.0
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  firebase_in_app_messaging: ^0.8.0+8
  firebase_messaging: ^15.1.3
  go_router: ^14.3.0
  google_maps_flutter: ^2.5.0
  google_sign_in: ^6.1.5
  http: ^1.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.1
  geoflutterfire_plus: ^0.0.31
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1

environment:
  sdk: '>=3.0.0 <6.0.0'

flutter:
  assets:
    - assets/
    - assets/icons/
  uses-material-design: true
