name: help_a_paw
description: Send emergency signals about animals in need
publish_to: 'none'
version: 7.0.0+133

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cloud_firestore: ^6.0.0
  cupertino_icons: ^1.0.6
  firebase_analytics: ^12.0.0
  firebase_app_check: ^0.4.0
  firebase_auth: ^6.0.0
  firebase_ui_auth: ^3.0.0
  # Google sign-in is integrated directly (not via firebase_ui_oauth_google,
  # which pins google_sign_in <7.0.0). google_sign_in 7.x uses Android's
  # Credential Manager and removes the legacy SignInHubActivity that crashed
  # with a NullPointerException on process recreation (Crashlytics add2187e).
  google_sign_in: ^7.2.0
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.0.0
  flutter_local_notifications: ^21.0.0
  go_router: ^17.1.0
  image_picker: ^1.1.2
  google_maps_flutter: ^2.9.0
  http: ^1.1.0
  intl: ^0.20.2
  photo_view: ^0.15.0
  map_launcher: ^3.5.0
  sign_in_button: ^5.0.0
  url_launcher: ^6.2.1
  webview_flutter: ^4.10.0
  geoflutterfire_plus: ^0.0.31
  geolocator: ^14.0.0
  flutter_riverpod: ^3.3.1
  cached_network_image: ^3.3.1
  share_plus: ^12.0.1
  package_info_plus: ^9.0.0
  shared_preferences: ^2.3.5
  flutter_svg: ^2.2.4
  app_links: ^6.4.1
  play_install_referrer: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Both are already in the tree transitively via geolocator; declared here
  # only so tests may import them to fake GeolocatorPlatform.
  geolocator_platform_interface: ^4.2.6
  plugin_platform_interface: ^2.1.8

environment:
  sdk: '>=3.0.0 <6.0.0'

flutter:
  generate: true
  assets:
    - assets/
    - assets/icons/
  uses-material-design: true
